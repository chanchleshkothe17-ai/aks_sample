apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generator
  namespace: image-generator
  labels:
    app.kubernetes.io/name: image-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: aksacrdev02.azurecr.io/image-generator:e317eac07d3c8023cb6f06b17609bdf081b4b836
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
