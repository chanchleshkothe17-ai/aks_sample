apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generator
  namespace: image-generator
  labels:
    app.kubernetes.io/name: image-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: image-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-generator
        # This label is what actually triggers the Workload Identity mutating webhook
        # to inject the federated token — without it, the ServiceAccount annotation
        # alone does nothing.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: image-generator-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: aksacrdev02.azurecr.io/image-generator:555900837e7568cf7d99544a61e9a5307749f79d
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            # Non-secret config only — hostname and DB name, nothing sensitive.
            # No password, connection string, or token is ever set as an env var here.
            - name: APP_AZURE_SQL_SERVER
              value: "aksmysql-sql-server.database.windows.net"
            - name: APP_AZURE_SQL_DATABASE
              value: "imagegendb"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
