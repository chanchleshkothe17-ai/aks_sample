apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: fastapi-ingress
  namespace: aks-demo

spec:
  ingressClassName: nginx

  rules:
    - host: api.example.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: fastapi-service

                port:
                  number: 80