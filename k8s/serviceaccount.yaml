apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-generator-sa
  namespace: image-generator
  annotations:
    # This annotation is the whole trick — it tells the Workload Identity webhook
    # which Azure managed identity this pod is allowed to become. Same role in
    # this setup that an IAM role ARN annotation plays for IRSA on EKS.
    azure.workload.identity/client-id: "<AZURE_MANAGED_IDENTITY_CLIENT_ID>"
